#cloud-config
###############################################################################
#  YallaCloud Nextcloud - cloud-init for Ubuntu 24.04 LTS           v1.4.0    #
#                                                                             #
#  WHAT TO EDIT:  only the lines under "EDIT THESE" in the nextcloud.conf     #
#  block below. NOTHING is strictly required - leave FQDN blank and the box   #
#  comes up on an sslip.io name off its own IP (move to the paid domain later #
#  with  yc-nc-domain <domain> --le). Everything else has a safe default.     #
#                                                                             #
#  BEFORE YOU DEPLOY:                                                         #
#    1. Point a DNS A record for your FQDN at the PUBLIC IP that reaches      #
#       this VM (direct public IP, or the firewall's public IP that NATs to   #
#       it). Needed for the real Let's Encrypt cert; without it the site      #
#       still comes up on a self-signed cert and you re-run certbot later.    #
#    2. Behind a firewall: forward TCP 80 AND 443 from that public IP to      #
#       this VM.                                                              #
#    3. Template (CloudStack, both clusters - tested 2026-10-27, PASS):       #
#       KVM    : LNX-Ubuntu-24.04-LTS-KVM-v263        offering gp.* (General) #
#       VMware : LNX-Ubuntu-24.04-LTS-VC-v263-fix2    offering VC Standard *  #
#       (NOT the old LNX-Ubuntu-24.04-LTS-VC-v263 - cloud-init never runs on  #
#        VMware with it: no network, no userdata.)                            #
#    4. Public IP on VLAN 101/102: run ipcheck --free + ARP before deploying. #
#                                                                             #
#  The installer + the Nextcloud tarball are pulled from GitHub (NOT          #
#  download.nextcloud.com, which is unreliable on this estate). All the       #
#  Ubuntu 24.04 fixes (apt mirror, nginx 1.24 http2, MariaDB unix_socket,     #
#  ssh.socket) live in the installer it fetches.                             #
#                                                                             #
#  Progress:  /var/log/yc-nextcloud-boot.log  then  yc-nextcloud-install.log  #
#  ONE log (deploy + day2, tagged): /var/log/yallacloud/nextcloud.log         #
#  Errors only: /var/log/yallacloud/errors.log  | on the VM: yallacloud logs   #
#  Result:    /root/yc-handover.json   (all passwords, chmod 600)             #
###############################################################################
package_update: false

write_files:
  # ----------------------------- EDIT THESE ---------------------------------
  - path: /etc/yallacloud/nextcloud.conf
    permissions: '0600'
    content: |
      # OPTIONAL - your real domain (must resolve to this VM's public IP). Leave it blank
      # or as the placeholder to auto-use an sslip.io name off this VM's IP; move to the
      # paid domain later in one step:  yc-nc-domain <your-domain> --le
      FQDN=cloud.example.com
      LE_EMAIL=bilalinamdar@gmail.com  # Let's Encrypt registration email (blank = register without email)

      # Optional - sensible defaults, change only if needed:
      ADMIN_USER=admin                 # Nextcloud admin login name
      DATA_PATH=/nc_data               # where user files live (root disk or a mounted volume)
      TIER=standard                    # basic | standard | hardened (hardened forces 2FA)
      TZ_SET=Asia/Dubai                # system timezone
      PHONE_REGION=AE                  # default phone region
      SUDO_USER_NAME=chadmin           # extra sudo user created on the VM
      SUDO_PASS=                       # blank = random per VM. Or one common password, in SINGLE quotes: SUDO_PASS='MyPass#2026xyz'
      HTTPS_PORT=                      # blank = 443. e.g. 8443 for a custom HTTPS port
      SET_HOSTNAME=yes                 # yes = hostnamectl set-hostname + /etc/hosts
      PERMIT_ROOT_LOGIN=yes            # yes | prohibit-password | no
      SSH_PUBKEY="ssh-rsa  guest"   # baked-in guest operator key (installed for root + sudo user); replace with your own if needed

      # Tarball source - GitHub release (do NOT point at download.nextcloud.com):
      TARBALL_URL=https://github.com/yallacloud/yc-scripts/releases/download/nc-latest
      TARBALL=                         # or a LOCAL pre-downloaded /root/latest.tar.bz2 (+ .sha256)

      # Ubuntu 24.04 apt mirror (UAE estate default; change per region):
      APT_MIRROR=ae.archive.ubuntu.com
      REPO_MIRROR=https://repo.oasisstack.io/payload   # internal fallback mirror for the tarball

      # Notifications - ntfy = status only (no secrets), webhook = full incl. passwords:
      NOTIFY_NTFY=yes
      NTFY_URL=https://n.oasisstack.io     # YallaCloud own ntfy (needs NTFY_TOKEN); no token = public https://ntfy.sh
      NTFY_TOKEN=                      # write-only publish token (user ycdeploy, topic 9890122212); blank = ntfy.sh
      NTFY_TOPIC=9890122212              # ntfy topic (status only); blank = the YallaCloud default 9890122212
      NOTIFY_WEBHOOK=no                  # set yes + WEBHOOK_SECRET to enable
      WEBHOOK_URL=https://api.yallacloud.net/api/v1/webhooks/cloudstack
      WEBHOOK_SECRET=                    # X-Webhook-Secret (required to turn the webhook on)
      EXTRA_WEBHOOK_URL=                 # optional second webhook: flat milestone events (vm.<area>.<state>), never secrets; blank = off
      EXTRA_WEBHOOK_SECRET=              # its X-Webhook-Secret
      # CloudStack context for the webhook (deployer/portal fills these - the guest cannot know them):
      CLOUDSTACK_URL=https://dxb01.oasisstack.io/client  # portal; webhook sends cloudPortal + cloudVmUrl=.../#/vm/<uuid>
      CS_DOMAIN=                         # CloudStack domain/tenant that owns this VM (webhook 'tenant' if Salt has not published yet)
      CS_ACCOUNT=                        # CloudStack account that owns this VM
      CS_INSTANCE=                       # CloudStack internal instance name (i-2-xxxx); blank = the UUID
      CS_ROOT_PASS=                      # blank = auto: public IP reads the VR/cloud-init password, private IP the ConfigDrive, else generated (reported as rootPasswordSource)
      VM_NAME=                           # CloudStack VM display name (blank = auto-detect from cloud-init)

      # Integrations - Salt minion join + Acronis backup agent:
      JOIN_SALT=yes                    # yes|no - join this VM to the Salt master (salt.oasisstack.io:4506); skipped if unreachable
      ACRONIS_TOKEN=                   # Acronis registration token; BLANK = skip Acronis entirely
      ACRONIS_REGION=AE                # AE|SG - Acronis datacenter region
      GLPI_AGENT_PASS=                       # GLPI agent password: set = inventory to glpi.oasisstack.io (tenant tag automatic); blank = skip

      # Advanced / auto-detected - leave blank unless you know you need them:
      SSH_PORT_OVERRIDE=               # blank = 3222 on public IP, 22 behind NAT
      GATEWAY_OVERRIDE=                # blank = auto; set firewall LAN IP e.g. 172.30.30.1 if wrong
      PUBLIC_IP=                       # optional: public IP reaching this VM (firewall public IP behind NAT); used for the sslip.io fallback + webhook
      DISABLE_CLOUD_INIT=yes           # yes = stop cloud-init re-running each boot (set 'no' for a template/clone base)
      REBOOT_AFTER=yes                 # yes = verify services+ports then reboot cleanly
  # --------------------------- END EDIT THESE -------------------------------

  - path: /opt/yc-nc/start.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      # Validate the operator's inputs and apply fallbacks BEFORE the long
      # install, so a typo fails in seconds instead of ~10 minutes in.
      set -u
      C=/etc/yallacloud/nextcloud.conf
      L=/var/log/yc-nextcloud-boot.log
      RAW="https://raw.githubusercontent.com/yallacloud/yc-scripts/main/nextcloud/yc-nextcloud-install.sh"
      fail() { echo "YC-FATAL: $*" | tee -a "$L" >/dev/null; echo "YC-FATAL: $*" > /root/yc-INSTALL-FAILED; exit 1; }
      [ -f "$C" ] || fail "missing $C"
      . "$C"

      # --- FQDN (optional): blank or the placeholder => the installer derives an
      #     sslip.io name off this VM's IP; a value that IS given must look like a domain ---
      case "${FQDN:-}" in
        ""|cloud.example.com) echo "[cloud-init] no FQDN set - installer will use an sslip.io fallback" | tee -a "$L" >/dev/null ;;
        *.*) : ;;                                  # looks like a domain - fine
        *)   fail "FQDN '$FQDN' is not a valid domain name" ;;
      esac

      # --- validate the few that can break the build if mistyped ---
      case "${TIER:-standard}" in basic|standard|hardened) : ;; *) fail "TIER must be basic|standard|hardened (got '${TIER}')";; esac
      if [ -n "${HTTPS_PORT:-}" ]; then
        case "$HTTPS_PORT" in *[!0-9]*) fail "HTTPS_PORT must be a number (got '$HTTPS_PORT')";; esac
      fi
      case "${PERMIT_ROOT_LOGIN:-yes}" in yes|no|prohibit-password) : ;; *) fail "PERMIT_ROOT_LOGIN must be yes|no|prohibit-password";; esac

      # --- fallbacks: never let a blank here send us to download.nextcloud.com or a slow mirror ---
      [ -n "${TARBALL_URL:-}" ] || [ -n "${TARBALL:-}" ] || \
        echo "TARBALL_URL=https://github.com/yallacloud/yc-scripts/releases/download/nc-latest" >> "$C"
      grep -q '^APT_MIRROR=' "$C" 2>/dev/null || echo "APT_MIRROR=ae.archive.ubuntu.com" >> "$C"

      echo "[cloud-init] inputs OK for $FQDN - fetching installer" | tee -a "$L" >/dev/null

      # --- fetch the installer from GitHub (retry) and run it detached ---
      i=1
      while [ "$i" -le 6 ]; do
        curl -fsSL "$RAW" -o /opt/yc-nc/install.sh && break
        echo "[cloud-init] installer fetch attempt $i failed, retrying" | tee -a "$L" >/dev/null
        i=$((i+1)); sleep 10
      done
      [ -s /opt/yc-nc/install.sh ] || fail "could not fetch the installer from GitHub after 6 tries"
      chmod +x /opt/yc-nc/install.sh
      exec setsid /opt/yc-nc/install.sh </dev/null >>/var/log/yc-nextcloud-install.log 2>&1 &

runcmd:
  - /opt/yc-nc/start.sh
